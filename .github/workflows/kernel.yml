name: kernel

# Heavy XNU build (M2 gate).  The phone cannot reasonably build XNU (time/RAM),
# so this runs on GitHub Actions.  The common `mtk` branch is the MT6768
# reference; the MT6785 SoC layer/config in this repository is the port.
# The theos Linux toolchain + iPhoneOS 16.5 SDK are required by xnu-deps.
on:
  workflow_dispatch:

jobs:
  xnu:
    name: common mtk branch (reference) + device
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: device

      - name: Common tree (HakiOS mtk branch)
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: mtk
          path: common
          fetch-depth: 1
          submodules: false

      - name: Place the device where the common tooling expects it
        run: |
          mkdir -p common/devices/begonia
          rsync -a --exclude .git device/ common/devices/begonia/

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache cmake ninja-build \
            python3 python3-yaml libssl-dev lld clang llvm device-tree-compiler \
            libgnutls28-dev uuid-dev pkg-config libyaml-dev flex bison m4 \
            autoconf automake libtool xz-utils rsync curl git perl zip \
            fakeroot libxml2-dev libtinfo6 libz3-dev >/dev/null
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=4G" >> "$GITHUB_ENV"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-begonia-mtk-${{ github.sha }}
          restore-keys: |
            ccache-begonia-mtk-
            ccache-mt6768-

      - name: theos (cctools + iPhoneOS 16.5 SDK), cached
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-v1

      - name: theos if the cache missed
        run: |
          if [ ! -x "$HOME/theos/toolchain/linux/iphone/bin/ld" ]; then
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o /tmp/install-theos
            sed -i 's/git libxml2 \\/git \\/' /tmp/install-theos
            bash /tmp/install-theos
          fi
          ls "$HOME/theos/toolchain/linux/iphone/bin" | head -n 5
          ls "$HOME/theos/sdks" | head -n 5

      - name: iPhoneOS 16.5 SDK (theos/sdks)
        run: |
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            git clone --depth 1 https://github.com/theos/sdks /tmp/theos-sdks
            cp -a /tmp/theos-sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          fi
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk/usr/include"

      - name: xnu-deps stage 1 (sources, host tools, SDK)
        working-directory: common
        run: |
          mkdir -p logs
          xnu-deps/setup.sh --stage1 2>&1 | tee logs/xnu-deps-stage1.log

      - name: Apple XNU + redwood patch
        working-directory: common
        run: |
          xnu/apply.sh 2>&1 | tee logs/xnu-apply.log

      - name: xnu-deps stage 2 (static libs against the kernel headers)
        working-directory: common
        run: |
          xnu-deps/setup.sh --stage2 2>&1 | tee logs/xnu-deps-stage2.log

      - name: Kernel (common mtk reference)
        working-directory: common
        run: |
          ./xnu-build.sh -j4 2>&1 | tee logs/xnu-build.log
          # The common tree writes the linked kernel under xnu-src/**/BUILD/obj;
          # copy it to a stable name for the payload tooling and the artifact.
          # The output tree also holds mach.development.*.dSYM, .unstripped,
          # .yml, .a and .exp; only the linked Mach-O is the kernel.
          K=
          while IFS= read -r f; do
            if file "$f" | grep -q 'Mach-O'; then K=$f; break; fi
          done < <(find xnu-src -maxdepth 8 -type f -path '*/BUILD/obj/DEVELOPMENT_ARM64_*/*' -name 'mach.development.*' 2>/dev/null)
          echo "kernel=$K" | tee logs/artifacts.txt
          if [ -n "$K" ]; then
            cp "$K" hakios-kernel
            file hakios-kernel | tee -a logs/artifacts.txt
            ls -l hakios-kernel | tee -a logs/artifacts.txt
          else
            echo "no linked kernel found" | tee -a logs/artifacts.txt
            exit 1
          fi

      - name: Collect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: begonia-xnu-reference-${{ github.sha }}
          path: |
            common/logs/**
            common/.config
            common/hakios-kernel
            common/kernel.ver
          if-no-files-found: warn
          retention-days: 30
