# devices/begonia/device.conf: what this phone is, and how far each part works.
# Only what has been seen on the phone is "works"; the M1 loader is built and
# its chain image is verified, not yet run on hardware.
device begonia
	title	Xiaomi Redmi Note 8 Pro
	vendor	Xiaomi
	soc	mt6785
	defconfig	begonia_defconfig
	firmware	pull-firmware.sh
	maintainer	Joel (criollojoel10)
	status	boot	partial	M1 mtkchain loader chains the Linux Image from boot; XNU payload not built or run
	status	display	not started	1080x2340; Novatek NT36672A panel; LK framebuffer address TBD
	status	touch	not started	Novatek NT36672A over SPI; the Linux driver is the reference
	status	buttons	not started	power/volume; LK keypad address TBD
	status	cpu	not started	8 cores (2x Cortex-A76 + 6x Cortex-A55); MT6785
	status	gpu	not started	Mali-G76 MC4; the common MT6768 Mali driver is the starting point
	status	storage	partial	Linux root on UFS; the 32 GiB microSD holds xnusys/hackios-log (M2)
	status	audio	missing	TFA9874/MT6359; the Linux audio stack is currently disabled
	status	battery	partial	MT6360 driver exists in Linux; the XNU driver is missing
	status	wifi	missing	MT6785 CONNSYS; the common MT6768 path is the reference
	status	bluetooth	missing	MT6785 CONNSYS; the common MT6768 path is the reference
	status	cellular	missing	MT6785 modem; not a first milestone
	status	thermal	missing	MT6785 thermal; the common MT6768 path is the reference
	status	camera	missing	not a first milestone
